version: '3.8'

services:
  # Python Backend
  backend3:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - .env
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/uprev_db
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - COMPANY_WHATSAPP=${COMPANY_WHATSAPP}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      db3:
        condition: service_healthy
    networks:
      - stargaze-network

  # Next.js Frontend
  frontend3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend3:8000
    depends_on:
      - backend3
    networks:
      - stargaze-network

  # PostgreSQL Database (Moved from server/docker-compose.yml)
  db3:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uprev_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stargaze-network

networks:
  stargaze-network:
    external: true

volumes:
  postgres_data:
    driver: local
