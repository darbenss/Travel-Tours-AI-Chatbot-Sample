version: '3.8'

services:
  # Nginx Proxy Manager (GUI + Auto SSL)
  nginx:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: uprev_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:80" # Public HTTP Port (Change in .env)
      - "${DASHBOARD_PORT:-3002}:81" # Dashboard Port (Change in .env)
      - "3443:443" # Public HTTPS Port (Optional)
    volumes:
      - ./nginx/data:/data
      - ./nginx/letsencrypt:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  # Python Backend
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: uprev_backend
    restart: unless-stopped
    # Ports removed (access via Nginx)
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/uprev_db
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT}
      - ALLOWED_ORIGINS=*
      - COMPANY_WHATSAPP=${COMPANY_WHATSAPP}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uprev_frontend
    restart: unless-stopped
    # Ports removed (access via Nginx)
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - app-network

  # PostgreSQL Database (Moved from server/docker-compose.yml)
  db:
    image: pgvector/pgvector:pg16
    container_name: uprev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uprev_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
